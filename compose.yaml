name: syncnest

services:
  syncnest:
    build: .
    image: syncnest:local
    pull_policy: never
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # FFmpeg parses untrusted media. If a decoder bug is exploited, the attacker
    # finds a read-only image and bounded processes and memory. HLS buffers and
    # tool caches live in a memory-backed /tmp that is wiped on restart.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    pids_limit: 2048
    mem_limit: ${SYNCNEST_MEMORY_LIMIT:-4g}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to your server hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - syncnest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
