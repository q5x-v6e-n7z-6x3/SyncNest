name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Builds the player and runs the frontend and offline Python suites in the
      # same image the server uses. No Discord credentials are needed.
      - name: Run the offline test suite
        run: docker build --target tests .
